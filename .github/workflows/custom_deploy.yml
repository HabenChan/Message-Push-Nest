name: custom-deploy-your-server


on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install npm dependencies
        run: npm ci
        working-directory: web/

      - name: Run npm build
        run:  echo "BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV && export NODE_ENV=prod && npm run build
        working-directory: web/

      - name: Check build static
        run: ls dist/ -la
        working-directory: web/

      - name: Get Release version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Update Local Version File
        run: echo ${{ steps.get_version.outputs.VERSION }} > .release_version

      - name: Install Go modules
        run: go mod tidy

      - name: Build Go
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64  go build -o Message-Nest

      - name: Trigger Watchtower CD Update
        continue-on-error: true
        env:
          DEPLOY_CMD: ${{ secrets.WATCHTOWER_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_CMD" ]; then
            echo "ℹ️ 未配置 WATCHTOWER_WEBHOOK_URL，跳过更新"
            exit 0
          fi
          echo "🚀 触发 Watchtower 容器自动更新..."
          eval "$DEPLOY_CMD"

